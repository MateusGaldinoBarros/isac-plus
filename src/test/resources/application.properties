# Configuracao dos testes: substitui o application.properties principal no classpath de teste.
# Nao importa o .env.local, entao os testes rodam igual na maquina de qualquer um e no CI.
spring.application.name=isac-plus

# H2 em memoria no lugar do Neon
spring.datasource.url=jdbc:h2:mem:isac-plus;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valores ficticios: nenhum teste de contexto chama esses servicos de verdade
storage.endpoint=http://localhost:8333
storage.access-key=teste
storage.secret-key=teste
storage.bucket=isac-plus-teste
storage.region=us-east-1

evolution.url=http://localhost:8080
evolution.api-key=teste
evolution.timeout=5s

# Evita que o processamento agendado de imagens rode no meio dos testes
imagens.processamento.atraso-inicial=1h
