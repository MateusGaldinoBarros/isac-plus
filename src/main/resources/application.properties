spring.application.name=isac-plus
server.port=8081

spring.config.import=optional:file:.env.local[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Storage de imagens (S3). Bucket e regiao tem valor padrao; o resto vem do .env.local ou do ambiente
storage.endpoint=${S3_ENDPOINT}
storage.access-key=${S3_ACCESS_KEY}
storage.secret-key=${S3_SECRET_KEY}
storage.bucket=${S3_BUCKET:isac-plus-imagens}
storage.region=${S3_REGION:us-east-1}

# Evolution API (para baixar as imagens recebidas). A chave e a AUTHENTICATION_API_KEY do .env
evolution.url=${EVOLUTION_URL}
evolution.api-key=${EVOLUTION_API_KEY}
evolution.timeout=${EVOLUTION_TIMEOUT:30s}
