services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      evolution-postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # 6379 no host ja e usado por outro projeto; internamente continua redis:6379
      - "6380:6379"
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVO_DB_USER}
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVO_DB_USER} -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Armazenamento de imagens compativel com S3 (gratuito, Apache 2.0).
  # O backend fala S3 puro, entao em producao da para trocar por R2/S3 so mudando as variaveis.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: isac_plus_storage
    restart: unless-stopped
    command: server -dir=/data -s3
    environment:
      # Sem essas chaves o S3 recusa qualquer requisicao (403)
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?defina STORAGE_ACCESS_KEY no .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?defina STORAGE_SECRET_KEY no .env}
    ports:
      - "8333:8333"
    volumes:
      - isac_plus_storage:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isac_plus_backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env.local
    environment:
      # Dentro do Docker o storage e acessado pelo nome do servico, nao por localhost
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
      EVOLUTION_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${AUTHENTICATION_API_KEY}
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  evolution_instances:
  evolution_redis:
  evolution_postgres:
  isac_plus_storage:
